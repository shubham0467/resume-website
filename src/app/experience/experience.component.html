<section class="experience">
  <div class="experience-container">
    <h2>Experience</h2>
    <p class="experience-subtitle">My professional journey and work history</p>

    <div class="total-experience">
      🗓️ Total Experience: <strong>{{ totalExperience }}</strong>
    </div>

    <div class="company-stats">
      <div class="company-stat" *ngFor="let c of companyStats">
        <span class="company-stat-name">🏢 {{ c.company }}</span>
        <span class="company-stat-duration">{{ c.duration }}</span>
      </div>
    </div>

    <div class="experience-timeline">
    <div
      *ngFor="let exp of experiences; let last = last"
      class="experience-card"
      [class.last]="last"
      (click)="toggleExperience(exp)"
    >

  <div class="timeline-dot"></div>

  <div class="experience-content">

    <div class="experience-header">
      <div class="company-info">
        <span class="icon">{{ exp.icon }}</span>

        <div>
          <h3>{{ exp.position }}</h3>
          <p class="company">{{ exp.company }}</p>
        </div>
      </div>

      <span class="duration">{{ exp.duration }}</span>
    </div>

    <p class="location">📍 {{ exp.location }}</p>

    <p class="description">{{ exp.description }}</p>

    <!-- expanded details -->
    <ul *ngIf="exp.expanded" class="experience-details">
      <li *ngFor="let item of exp.details">{{ item }}</li>
    </ul>

    <div class="skills-list">
      <span *ngFor="let skill of exp.skills" class="skill-tag">{{ skill }}</span>
    </div>

  </div>
</div>
    </div>
  </div>
</section>
